      <h1>Nexus Guard: connect your agents once. Link your services once.</h1>
      <p>Nexus Guard is a project-aware scaffold for coding-agent service access (Tauri 2, React, Rust). Status: scaffold, not yet MVP. Linux first. Supabase-only MVP (+ GitHub spike, labeled). HTTP-only transport. This page needs JavaScript for the full interactive site; the summary below is the same content agents and search engines get without it.</p>
      <h2>Canonical chain</h2>
      <p>Agent → Session → Project → Environment → Service → Account → Resource → Capability → Policy Decision. Supabase + Koupa ≠ Supabase + Nabdh. Supabase + production ≠ Supabase + development.</p>
      <h2>MVP scope</h2>
      <p>Local desktop app on Linux; project registry with secret-free .nexus/project.json; one provider (Supabase, + GitHub spike labeled); HTTP-only single transport; isolated concurrent agent sessions; minimal Guard decisions (allow, warn, require approval, block — full engine deferred); secret-free local audit log; agent-facing MCP interface: nexus.context, nexus.request_access, nexus.execute. Not a vault, enterprise-governance platform, filesystem sandbox, or full policy engine in MVP.</p>
      <h2>Rules</h2>
      <p>Only the developer can change policy. Missing or conflicting project identity stops the request — Nexus never silently guesses. Secrets stay in OS secure storage. Anything outside Nexus is unmanaged, not protected.</p>
