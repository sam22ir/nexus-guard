      <h1>Nexus: connect your agents once. Link your services once.</h1>
      <p>Nexus is the single place where AI coding agents connect and the single place where services are linked. It works out which project an agent is in and routes every call to that project's account and resource, so an agent can never reach another project's services. Status: MVP in progress, Linux first. This page needs JavaScript for the interactive parts; the summary below is the same content agents and search engines get without it.</p>
      <h2>How it works</h2>
      <p>Agent → Session → Project → Environment → Service → Account → Resource → Capability. Supabase + Project A ≠ Supabase + Project B. Supabase + production ≠ Supabase + development. Nexus resolves the project, refuses anything unresolved or unregistered before any provider call, and forwards with the bound account's credentials. Agents never hold keys.</p>
      <h2>MVP scope</h2>
      <p>Local desktop app (Linux first); project registry with a secret-free .nexus/project.json; a starting catalog of about 50 services with native Supabase and GitHub adapters; account linking once in a Services tab; agents connect over one persistent local HTTP endpoint; isolated concurrent sessions; a local activity log. Guard (risk rules, approvals, spend limits) is post-MVP and a possible paid feature.</p>
      <h2>Rules</h2>
      <p>Only the developer can change bindings. Conflicting signals surface and ask; Nexus never silently guesses. Nexus is not a vault, an enterprise governance platform, or a filesystem sandbox. Anything outside Nexus is unmanaged, not protected.</p>
      <p>Machine-readable brief: <a href="/llms.txt">llms.txt</a>. Code: <a href="https://github.com/saadi/nexus-guard">github.com/saadi/nexus-guard</a>.</p>
