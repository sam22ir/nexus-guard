      <h1>Nexus: connect your agents once. Link your services once.</h1>
      <p>Nexus sits between your coding agents and your services. It sends each agent to its own project's account, so an agent working on one project can't touch another's. Built for Linux. This page needs JavaScript for the interactive parts; this is the same content in short.</p>
      <h2>How it works</h2>
      <p>The agent asks Nexus for a service. Nexus works out which project the agent is in, finds the account and resource linked to that project, and makes the call with that account's login. The agent never sees the key. If Nexus can't tell the project, or the project isn't registered, it refuses.</p>
      <h2>What it covers</h2>
      <p>About 50 popular services to start, with built-in support for Supabase and GitHub. Claude Code, Codex and OpenCode connect to one local Nexus. A risk-review layer called Guard may come later. Nexus is not a password manager or a file sandbox, and it can't protect anything an agent does without going through it.</p>
      <p>Short version for machines: <a href="/llms.txt">llms.txt</a>.</p>
