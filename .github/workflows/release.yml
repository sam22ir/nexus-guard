name: Release installers

# Builds unsigned installers for each platform and attaches them to a DRAFT
# GitHub release, so nothing is published until you review and publish it.
# Run it from the Actions tab, or push a tag such as v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          # Both Macs build on Apple Silicon; Intel is cross-compiled
          # (the old Intel runners are retired).
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          # The .msi step (WiX light.exe) failed on the runner with no detail, so
          # Windows ships the NSIS setup.exe, Tauri's default Windows installer.
          - os: windows-latest
            args: --bundles nsis --verbose
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 25.5+ is needed to build the standalone server (Node SEA with an ES module).
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev

      - run: npm ci

      - run: npm run test:mcp

      # macOS signing and notarization. Runs only when the Apple secrets exist
      # (see docs/code-signing.md). Each value is exported to GITHUB_ENV only if
      # non-empty, so tauri-action sees the variable absent, not empty, when a
      # secret is missing. Without them the macOS build stays unsigned.
      # Values are never printed.
      # UNVERIFIED: the Tauri docs do not say whether bundle.externalBin
      # sidecars (nexus-keyring, nexus-server) get signed with the app identity.
      # Check on the first signed build with `codesign -dv --verbose=4` on each
      # binary inside the .app. The Node-based nexus-server may also need
      # hardened-runtime entitlements (JIT) to run after notarization; verify too.
      - name: Apple signing setup (macOS, only if secrets exist)
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              delim="EOF_${name}_${RANDOM}${RANDOM}"
              {
                echo "$name<<$delim"
                printf '%s\n' "$value"
                echo "$delim"
              } >> "$GITHUB_ENV"
            fi
          done
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "macOS signing: on"
          else
            echo "macOS signing: off (unsigned build)"
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "macOS notarization: on"
          else
            echo "macOS notarization: off"
          fi

      # Windows: left unsigned. Two routes are possible once a signing service
      # is chosen (see docs/code-signing.md):
      #   1. SignPath (free for open source, needs an OSI license in the repo):
      #      add a step after the build that uploads the .exe/.msi to SignPath
      #      and replaces the file with the signed one.
      #   2. Tauri's own signing: set bundle.windows.signCommand in
      #      src-tauri/tauri.conf.json. Tauri reads it from the config, not
      #      from an environment variable, so it cannot be toggled by a secret.
      # - name: Windows signing (not wired yet)
      #   if: startsWith(matrix.os, 'windows')
      #   run: echo "Windows signing not configured"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater files (.sig, latest.json). Required: with createUpdaterArtifacts on, the build fails without them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Public identifiers for the Nexus GitHub App (docs/github-app-setup.md). Unset = GitHub shows as not set up.
          NEXUS_GITHUB_CLIENT_ID: ${{ vars.NEXUS_GITHUB_CLIENT_ID }}
          NEXUS_GITHUB_APP_SLUG: ${{ vars.NEXUS_GITHUB_APP_SLUG }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          releaseName: Nexus Guard ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }} (alpha)
          releaseBody: Alpha build, unsigned by the OS. See the README quick start.
          releaseDraft: true
          # Not a pre-release: GitHub's releases/latest skips pre-releases, so the updater endpoint would 404. "Alpha" stays in the body.
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
