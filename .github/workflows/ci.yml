name: Checks

# Runs every test on Linux, macOS and Windows, so a change that only works on
# one of them is caught before it reaches an installer.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev

      - run: npm ci

      - run: npm run test:mcp

      - run: npm run build

      # The app's build script needs the bundled server and keychain helper to exist.
      - run: node scripts/prepare-bundle.mjs dev

      - run: cargo test --manifest-path src-tauri/Cargo.toml
